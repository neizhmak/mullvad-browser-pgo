name: Build verified official Node support checkpoint
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      release:
        description: Identity-bound technical Node support prerelease
        value: ${{ jobs.node.outputs.release }}
      identity_sha256:
        description: Full canonical SHA-256 of the official Node input identity
        value: ${{ jobs.node.outputs.identity_sha256 }}
permissions:
  contents: write
# Serialize all Node lock identities. This group is distinct from parent/Rust
# groups and does not depend on a moving branch or unverified workflow input.
concurrency:
  group: pgo-support-node-${{ github.repository }}
  cancel-in-progress: false
env:
  RBM_NO_DEBUG: "1"
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      release: ${{ steps.identity.outputs.release }}
      identity_sha256: ${{ steps.identity.outputs.identity_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned support build
        run: echo "UPSTREAM=$RUNNER_TEMP/tor-browser-build" >> "$GITHUB_ENV"
      - name: Install RBM requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libdata-dump-perl libdata-uuid-perl libdatetime-perl libdigest-sha-perl libfile-copy-recursive-perl libfile-slurp-perl libio-all-perl libcapture-tiny-perl libio-handle-util-perl libjson-perl libparallel-forkmanager-perl libpath-tiny-perl libsort-versions-perl libstring-shellquote-perl libtemplate-perl libxml-libxml-perl libxml-writer-perl libyaml-libyaml-perl git uidmap zstd jq
      - name: Prepare and validate RBM user namespaces
        shell: bash
        run: |
          set -euo pipefail
          build_user="$(id -un)"
          echo "RBM build user: $build_user (uid=$(id -u) gid=$(id -g))"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          missing_files=()
          for map_file in /etc/subuid /etc/subgid; do
            if ! awk -F: -v user="$build_user" '$1 == user && $3 > 0 { found = 1 } END { exit !found }' "$map_file"; then
              missing_files+=("$map_file")
            fi
          done
          if (( ${#missing_files[@]} )); then
            range_start="$(python3 - <<'PYNS'
          from pathlib import Path
          size = 65536
          ranges = []
          for filename in ('/etc/subuid', '/etc/subgid'):
              for line in Path(filename).read_text().splitlines():
                  fields = line.split(':')
                  if len(fields) != 3:
                      continue
                  try:
                      start, length = map(int, fields[1:])
                  except ValueError:
                      continue
                  if length > 0:
                      ranges.append((start, start + length))
          candidate = 100000
          while True:
              end = candidate + size
              conflicts = [stop for start, stop in ranges if candidate < stop and start < end]
              if not conflicts:
                  print(candidate)
                  break
              candidate = max(conflicts)
          PYNS
            )"
            for map_file in "${missing_files[@]}"; do
              printf '%s:%s:65536\n' "$build_user" "$range_start" | sudo tee -a "$map_file" >/dev/null
            done
          fi
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          sysctl kernel.apparmor_restrict_unprivileged_userns
          awk -F: -v user="$build_user" '$1 == user' /etc/subuid | sed 's/^/subuid: /'
          awk -F: -v user="$build_user" '$1 == user' /etc/subgid | sed 's/^/subgid: /'
      - name: Fetch exact official tree and preflight pinned RBM
        run: |
          ./scripts/fetch-upstream.sh --destination "$UPSTREAM"
          git -C "$UPSTREAM" submodule update --init rbm
          "$UPSTREAM/rbm/container" run -- /bin/true
      - name: Resolve official Node source identity
        id: identity
        run: |
          ./scripts/resolve-pgo-support-identity.py --upstream "$UPSTREAM" --project node \
            --output "$RUNNER_TEMP/node-identity.json" --metadata-output "$RUNNER_TEMP/node-checkpoint.json"
          release="$(jq -r .release "$RUNNER_TEMP/node-checkpoint.json")"
          identity="$(jq -r .identity_sha256 "$RUNNER_TEMP/node-checkpoint.json")"
          echo "SUPPORT_RELEASE=$release" >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "identity_sha256=$identity" >> "$GITHUB_OUTPUT"
      - name: Check byte-verified Node checkpoint
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ./scripts/rbm-release-artifacts.py stage-complete --upstream "$UPSTREAM" \
            --release "$SUPPORT_RELEASE" --stage node --identity-file "$RUNNER_TEMP/node-identity.json"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            test "$status" -eq 1 || { echo 'Node checkpoint failed integrity/access verification' >&2; exit "$status"; }
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore and bind the existing exact Node archive
        if: steps.cache.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/rbm-release-artifacts.py restore-required --upstream "$UPSTREAM" \
            --release "$SUPPORT_RELEASE" --stage node --identity-file "$RUNNER_TEMP/node-identity.json"
          ./scripts/resolve-pgo-support-identity.py --upstream "$UPSTREAM" --output "$RUNNER_TEMP/node-identity.json" \
            --verify-output --registry "$RUNNER_TEMP/rbm-registry/registry-node.json"
      - name: Snapshot official outputs before Node build
        if: steps.cache.outputs.complete != 'true'
        run: ./scripts/rbm-release-artifacts.py snapshot --upstream "$UPSTREAM" --file "$RUNNER_TEMP/node-before"
      - name: Build only official native Node through pinned RBM
        if: steps.cache.outputs.complete != 'true'
        timeout-minutes: 120
        run: |
          python3 ./scripts/observe-rbm-build.py --upstream "$UPSTREAM" --log "$RUNNER_TEMP/node-build.log" \
            --resource-log "$RUNNER_TEMP/node-resources.jsonl" -- \
            ./rbm/rbm build node --target alpha --target mullvadbrowser-windows-x86_64
      - name: Verify and stage only the exact built archive
        if: steps.cache.outputs.complete != 'true'
        run: |
          set -euo pipefail
          ./scripts/resolve-pgo-support-identity.py --upstream "$UPSTREAM" --output "$RUNNER_TEMP/node-identity-after.json" --verify-output
          cmp "$RUNNER_TEMP/node-identity.json" "$RUNNER_TEMP/node-identity-after.json"
          filename="$(jq -r .output_filename "$RUNNER_TEMP/node-identity.json")"
          mkdir -p "$RUNNER_TEMP/node-payload/out/node"
          # The source tarball shares out/node/. Do not commit it or unrelated
          # recursive outputs. Same-filesystem hardlink avoids a second archive.
          ln "$UPSTREAM/out/node/$filename" "$RUNNER_TEMP/node-payload/out/node/$filename"
      - name: Publish Node archive and verified registry last
        if: steps.cache.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/rbm-release-artifacts.py publish --upstream "$RUNNER_TEMP/node-payload" \
            --release "$SUPPORT_RELEASE" --before "$RUNNER_TEMP/node-before" --stage node --project node \
            --identity-file "$RUNNER_TEMP/node-identity.json"
      - name: Preserve Node diagnostics and source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-support-node-logs
          path: |
            ${{ runner.temp }}/node-build.log
            ${{ runner.temp }}/node-resources.jsonl
            ${{ runner.temp }}/node-identity.json
            ${{ runner.temp }}/node-checkpoint.json
            ${{ runner.temp }}/tor-browser-build/logs/
          if-no-files-found: warn
