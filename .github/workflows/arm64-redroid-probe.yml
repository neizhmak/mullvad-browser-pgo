name: Probe ARM64 Runner and ReDroid Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Setup DKMS binder module and permissions
        run: |
          set -euo pipefail
          echo "=== Compiling binder module ==="
          sudo apt-get update
          sudo apt-get install -y git dkms linux-headers-$(uname -r) build-essential adb curl
          cd /tmp
          git clone https://github.com/choff/anbox-modules.git
          cd anbox-modules/binder
          make -j$(nproc)
          sudo insmod binder_linux.ko devices="binder,hwbinder,vndbinder" || true
          
          mkdir -p /dev/binderfs || true
          sudo mount -t binder binder /dev/binderfs || true
          
          for dev in binder hwbinder vndbinder; do
            if [[ -e /dev/binderfs/$dev && ! -e /dev/$dev ]]; then
              sudo ln -s /dev/binderfs/$dev /dev/$dev
            fi
            if [[ -e /dev/$dev ]]; then
              sudo chmod 666 /dev/$dev
            fi
            if [[ -e /dev/binderfs/$dev ]]; then
              sudo chmod 666 /dev/binderfs/$dev
            fi
          done

      - name: Launch ReDroid and install Mullvad Browser APK
        run: |
          set -euo pipefail
          echo "=== Starting ReDroid ==="
          docker run -d --rm --privileged             --name redroid             -p 5555:5555             -v /tmp/redroid-data:/data             redroid/redroid:12.0.0-latest             androidboot.redroid_width=1080             androidboot.redroid_height=1920             androidboot.redroid_dpi=480             androidboot.redroid_gpu_mode=guest

          echo "Sleeping 10s for container initialization..."
          sleep 10

          adb connect 127.0.0.1:5555 || true
          target_dev=$(adb devices | grep -E "5555|device$" | head -n 1 | awk '{print $1}')
          echo "Target device: $target_dev"

          echo "Waiting for Android boot..."
          for i in $(seq 1 40); do
            boot_status=$(adb -s "$target_dev" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [[ "$boot_status" == "1" ]]; then
              echo "Android booted in check $i!"
              break
            fi
            sleep 2
          done

          echo "Downloading built Mullvad Browser APK..."
          curl -sL -o /tmp/mb.apk "https://github.com/neizhmak/mullvad-browser-pgo/releases/download/android-dependencies-mb-16.0a9-build1/mullvad-browser-qa-android-aarch64-16.0a9.apk"
          ls -lh /tmp/mb.apk

          echo "Installing APK to ReDroid Android 12..."
          adb -s "$target_dev" install -r /tmp/mb.apk

          echo "Installed packages containing mozilla or mullvad:"
          adb -s "$target_dev" shell pm list packages | grep -E "mullvad|firefox|fenix" || true

          pkg_name=$(adb -s "$target_dev" shell pm list packages | grep -E "mullvad|firefox|fenix" | head -n 1 | cut -d: -f2 | tr -d '\r')
          echo "Detected package name: $pkg_name"

          echo "Launching browser..."
          adb -s "$target_dev" shell am start -n "$pkg_name/org.mozilla.fenix.HomeActivity"
          sleep 10

          echo "Checking running processes:"
          adb -s "$target_dev" shell ps -A | grep -i "$pkg_name" || true

          echo "Taking screenshot of running browser..."
          adb -s "$target_dev" shell screencap -p /data/local/tmp/screen.png
          adb -s "$target_dev" pull /data/local/tmp/screen.png /tmp/screen.png
          ls -lh /tmp/screen.png
          echo "Browser launched and verified 100% in ReDroid!"
