name: Validate upstream pin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out overlay repository
        uses: actions/checkout@v4

      - name: Resolve and validate upstream lock
        run: ./scripts/resolve-upstream.sh

      - name: Test upstream integrity handling
        run: ./tests/test-resolve-upstream.sh

      - name: Validate GitHub Actions workflows and expression contexts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Report stale upstream lock
        run: |
          if ! ./scripts/resolve-upstream.sh --check; then
            echo '::warning::A newer Mullvad Browser Alpha build tag is available.'
          fi

      - name: Fetch exact locked upstream tree
        run: ./scripts/fetch-upstream.sh --destination "$RUNNER_TEMP/tor-browser-build"
