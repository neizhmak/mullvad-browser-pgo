name: Build verified Windows PGO Rust toolchain
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      release:
        description: Identity-bound verified profiler Rust prerelease
        value: ${{ jobs.rust-build.outputs.release }}
permissions:
  contents: write
concurrency:
  group: pgo-rust-${{ github.ref }}
  cancel-in-progress: false
env:
  RBM_NO_DEBUG: "1"
jobs:
  rust-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      complete: ${{ steps.cache.outputs.complete }}
      release: ${{ steps.identity.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned build
        run: |
          echo "UPSTREAM=$RUNNER_TEMP/tor-browser-build" >> "$GITHUB_ENV"
          tag="$(jq -r .tag upstream.lock.json)"
          echo "RBM_RELEASE=rbm-dependencies-$tag" >> "$GITHUB_ENV"
      - name: Install RBM requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libdata-dump-perl libdata-uuid-perl libdatetime-perl libdigest-sha-perl libfile-copy-recursive-perl libfile-slurp-perl libio-all-perl libcapture-tiny-perl libio-handle-util-perl libjson-perl libparallel-forkmanager-perl libpath-tiny-perl libsort-versions-perl libstring-shellquote-perl libtemplate-perl libxml-libxml-perl libxml-writer-perl libyaml-libyaml-perl git uidmap zstd jq
      - name: Prepare and validate RBM user namespaces
        shell: bash
        run: |
          set -euo pipefail
          build_user="$(id -un)"
          echo "RBM build user: $build_user (uid=$(id -u) gid=$(id -g))"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          missing_files=()
          for map_file in /etc/subuid /etc/subgid; do
            if ! awk -F: -v user="$build_user" '$1 == user && $3 > 0 { found = 1 } END { exit !found }' "$map_file"; then
              missing_files+=("$map_file")
            fi
          done
          if (( ${#missing_files[@]} )); then
            range_start="$(python3 - <<'PYNS'
          from pathlib import Path
          size = 65536
          ranges = []
          for filename in ('/etc/subuid', '/etc/subgid'):
              for line in Path(filename).read_text().splitlines():
                  fields = line.split(':')
                  if len(fields) != 3:
                      continue
                  try:
                      start, length = map(int, fields[1:])
                  except ValueError:
                      continue
                  if length > 0:
                      ranges.append((start, start + length))
          candidate = 100000
          while True:
              end = candidate + size
              conflicts = [stop for start, stop in ranges if candidate < stop and start < end]
              if not conflicts:
                  print(candidate)
                  break
              candidate = max(conflicts)
          PYNS
            )"
            for map_file in "${missing_files[@]}"; do
              printf '%s:%s:65536\n' "$build_user" "$range_start" | sudo tee -a "$map_file" >/dev/null
            done
          fi
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          sysctl kernel.apparmor_restrict_unprivileged_userns
          awk -F: -v user="$build_user" '$1 == user' /etc/subuid | sed 's/^/subuid: /'
          awk -F: -v user="$build_user" '$1 == user' /etc/subgid | sed 's/^/subgid: /'
      - name: Fetch exact upstream and restore compilers
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ./scripts/fetch-upstream.sh --destination "$UPSTREAM"
          git -C "$UPSTREAM" submodule update --init rbm
          "$UPSTREAM/rbm/container" run -- /bin/true
          ./scripts/rbm-release-artifacts.py restore-required --upstream "$UPSTREAM" --stage clang --stage mingw-w64-clang --stage rust
      - name: Apply isolated profiler overlay
        run: ./scripts/prepare-pgo-generate.sh
      - name: Resolve immutable profiler Rust identity
        id: identity
        run: |
          ./scripts/resolve-pgo-rust-identity.py --upstream "$UPSTREAM" --output "$RUNNER_TEMP/pgo-rust-identity.json"
          sha="$(sha256sum "$RUNNER_TEMP/pgo-rust-identity.json" | cut -d' ' -f1)"
          release="pgo-toolchains-$(jq -r .tag upstream.lock.json)-$sha"
          echo "PGO_TOOLCHAIN_RELEASE=$release" >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Check verified toolchain checkpoint
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ./scripts/rbm-release-artifacts.py stage-complete --upstream "$UPSTREAM" --release "$PGO_TOOLCHAIN_RELEASE" --stage rust-pgo --identity-file "$RUNNER_TEMP/pgo-rust-identity.json"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            test "$status" -eq 1 || { echo 'Profiler Rust checkpoint failed integrity/access verification' >&2; exit "$status"; }
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore committed profiler-enabled Rust
        if: steps.cache.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/rbm-release-artifacts.py restore-required --upstream "$UPSTREAM" --release "$PGO_TOOLCHAIN_RELEASE" --stage rust-pgo --identity-file "$RUNNER_TEMP/pgo-rust-identity.json"
      - name: Build Windows profiler-enabled Rust
        if: steps.cache.outputs.complete != 'true'
        timeout-minutes: 280
        run: |
          set -euo pipefail
          cd "$UPSTREAM"
          ./rbm/rbm build rust --target alpha --target mullvadbrowser-windows-x86_64 --target pgo-generate
      - name: Compile and link with exact PGO Rust and MinGW
        run: ./scripts/preflight-pgo-rust.sh
      - name: Stage exact toolchain payload for verified publication
        if: steps.cache.outputs.complete != 'true'
        run: |
          set -euo pipefail
          filename="$(jq -r .rust.output_filename "$RUNNER_TEMP/pgo-rust-identity.json")"
          test -s "$UPSTREAM/out/rust/$filename"
          mkdir -p "$RUNNER_TEMP/pgo-rust-payload/out/rust"
          cp "$UPSTREAM/out/rust/$filename" "$RUNNER_TEMP/pgo-rust-payload/out/rust/$filename"
          cp "$RUNNER_TEMP/pgo-rust-identity.json" "$RUNNER_TEMP/pgo-rust-payload/identity.json"
      - uses: actions/upload-artifact@v4
        if: steps.cache.outputs.complete != 'true'
        with:
          name: pgo-rust-payload
          path: ${{ runner.temp }}/pgo-rust-payload/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-rust-preflight
          path: |
            ${{ runner.temp }}/pgo-rust-preflight.exe
            ${{ runner.temp }}/pgo-rust-identity.json
          if-no-files-found: error
      - name: Preserve Rust build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-rust-build-logs
          path: |
            ${{ runner.temp }}/tor-browser-build/logs/
            ${{ runner.temp }}/pgo-rust-runtime-inventory.log
            ${{ runner.temp }}/pgo-rust-identity.json
          if-no-files-found: warn
  rust-native-check:
    needs: rust-build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pgo-rust-preflight
          path: ${{ runner.temp }}/pgo-rust-preflight
      - name: Prove native Rust profile emission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LLVM_PROFILE_FILE = "$env:RUNNER_TEMP\rust-pgo-runtime-%p.profraw"
          & "$env:RUNNER_TEMP\pgo-rust-preflight\pgo-rust-preflight.exe"
          if ($LASTEXITCODE -ne 0) { throw "Profiler Rust executable failed with exit code $LASTEXITCODE" }
          $profiles = @(Get-ChildItem "$env:RUNNER_TEMP" -Filter 'rust-pgo-runtime-*.profraw' | Where-Object Length -gt 0)
          if ($profiles.Count -eq 0) { throw 'Rust profiler runtime produced no nonempty raw profile' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgo-rust-native-profiles
          path: ${{ runner.temp }}/rust-pgo-runtime-*.profraw
          if-no-files-found: error
  rust-publish:
    needs: [rust-build, rust-native-check]
    if: needs.rust-build.outputs.complete != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pgo-rust-payload
          path: ${{ runner.temp }}/pgo-rust-payload
      - name: Publish checkpoint only after native runtime validation
        env:
          GH_TOKEN: ${{ github.token }}
          PGO_TOOLCHAIN_RELEASE: ${{ needs.rust-build.outputs.release }}
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/empty-before"
          ./scripts/rbm-release-artifacts.py publish --upstream "$RUNNER_TEMP/pgo-rust-payload" --release "$PGO_TOOLCHAIN_RELEASE" --before "$RUNNER_TEMP/empty-before" --stage rust-pgo --project rust --identity-file "$RUNNER_TEMP/pgo-rust-payload/identity.json"
