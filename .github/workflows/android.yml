name: Build Mullvad Browser Android (Alpha APK)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Android architecture'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - armv7
          - x86_64

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}-${{ inputs.arch || 'aarch64' }}
  cancel-in-progress: false

env:
  RBM_NO_DEBUG: "1"
  TARGET_ARCH: ${{ inputs.arch || 'aarch64' }}

jobs:
  android-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RBM_PROJECT: node
    steps:
      - uses: actions/checkout@v4
      - name: Initialize environment
        run: |
          echo "UPSTREAM=$RUNNER_TEMP/tor-browser-build" >> "$GITHUB_ENV"
          tag="$(jq -r .tag upstream.lock.json)"
          echo "ANDROID_RELEASE=android-dependencies-$tag" >> "$GITHUB_ENV"
      - name: Install RBM and Android host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdata-dump-perl libdata-uuid-perl libdatetime-perl \
            libdigest-sha-perl libfile-copy-recursive-perl libfile-slurp-perl \
            libio-all-perl libcapture-tiny-perl libio-handle-util-perl libjson-perl \
            libparallel-forkmanager-perl libpath-tiny-perl libsort-versions-perl \
            libstring-shellquote-perl libtemplate-perl libxml-libxml-perl \
            libxml-writer-perl libyaml-libyaml-perl git uidmap zstd jq zip 7zip \
            openjdk-17-jdk-headless bsdiff
      - name: Prepare and validate RBM user namespaces
        shell: bash
        run: |
          set -euo pipefail
          build_user="$(id -un)"
          echo "RBM build user: $build_user (uid=$(id -u) gid=$(id -g))"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          missing_files=()
          for map_file in /etc/subuid /etc/subgid; do
            if ! awk -F: -v user="$build_user" '$1 == user && $3 > 0 { found = 1 } END { exit !found }' "$map_file"; then
              missing_files+=("$map_file")
            fi
          done
          if (( ${#missing_files[@]} )); then
            range_start="$(python3 - <<'PYNS'
          from pathlib import Path
          size = 65536
          ranges = []
          for filename in ('/etc/subuid', '/etc/subgid'):
              for line in Path(filename).read_text().splitlines():
                  fields = line.split(':')
                  if len(fields) != 3:
                      continue
                  try:
                      start, length = map(int, fields[1:])
                  except ValueError:
                      continue
                  if length > 0:
                      ranges.append((start, start + length))
          candidate = 100000
          while True:
              end = candidate + size
              conflicts = [stop for start, stop in ranges if candidate < stop and start < end]
              if not conflicts:
                  print(candidate)
                  break
              candidate = max(conflicts)
          PYNS
            )"
            for map_file in "${missing_files[@]}"; do
              printf '%s:%s:65536\n' "$build_user" "$range_start" | sudo tee -a "$map_file" >/dev/null
            done
          fi
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          sysctl kernel.apparmor_restrict_unprivileged_userns
      - name: Configure swap on runner
        run: |
          if [[ -d "/mnt" ]]; then
            swap_file="/mnt/android-swapfile"
            if sudo fallocate -l 20G "$swap_file" 2>/dev/null || sudo dd if=/dev/zero of="$swap_file" bs=1M count=20480 status=none 2>/dev/null; then
              sudo chmod 600 "$swap_file"
              sudo mkswap "$swap_file" >/dev/null 2>&1 || true
              sudo swapon "$swap_file" >/dev/null 2>&1 || true
            fi
          fi
      - name: Fetch exact upstream
        run: |
          ./scripts/fetch-upstream.sh --destination "$UPSTREAM"
          git -C "$UPSTREAM" submodule update --init rbm
          "$UPSTREAM/rbm/container" run -- /bin/true
      - name: Apply Android overlay
        run: ./scripts/prepare-android.sh
      - name: Check whether stage is complete
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ./scripts/rbm-release-artifacts.py stage-complete --upstream "$UPSTREAM" --release "$ANDROID_RELEASE" --stage "$RBM_PROJECT"; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore existing Android dependencies
        if: steps.stage.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/rbm-release-artifacts.py restore --upstream "$UPSTREAM" --release "$ANDROID_RELEASE" || true
      - name: Record existing outputs
        if: steps.stage.outputs.complete != 'true'
        run: ./scripts/rbm-release-artifacts.py snapshot --upstream "$UPSTREAM" --file "$RUNNER_TEMP/before"
      - name: Build stage through RBM
        if: steps.stage.outputs.complete != 'true'
        timeout-minutes: 170
        run: |
          set -euo pipefail
          echo "Building $RBM_PROJECT for mullvadbrowser-android-$TARGET_ARCH..."
          cd "$UPSTREAM"
          ./rbm/rbm build "$RBM_PROJECT" --target alpha --target "mullvadbrowser-android-$TARGET_ARCH"
      - name: Publish new stage outputs
        if: steps.stage.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/rbm-release-artifacts.py publish --upstream "$UPSTREAM" --release "$ANDROID_RELEASE" --before "$RUNNER_TEMP/before" --stage "$RBM_PROJECT"
      - name: Upload build logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.RBM_PROJECT }}
          path: ${{ runner.temp }}/tor-browser-build/logs/
          if-no-files-found: warn


