              sudo chmod 600 "$swap_file"
              sudo mkswap "$swap_file" >/dev/null 2>&1 || true
              sudo swapon "$swap_file" >/dev/null 2>&1 || true
            fi
          fi
      - name: Fetch exact upstream
        run: |
          ./scripts/fetch-upstream.sh --destination "$UPSTREAM"
          git -C "$UPSTREAM" submodule update --init rbm
          "$UPSTREAM/rbm/container" run -- /bin/true
      - name: Apply Android overlay
        run: ./scripts/prepare-android.sh
      - name: Restore all verified Android dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/rbm-release-artifacts.py restore --upstream "$UPSTREAM" --release "$ANDROID_RELEASE"
      - name: Build Mullvad Browser Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Starting RBM build for mullvadbrowser-android-$TARGET_ARCH..."
          cd "$UPSTREAM"

          PGO_ARGS=()
          if gh release view "$ANDROID_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -q "android-$TARGET_ARCH-pgo.profdata"; then
            echo "Found verified PGO profile for Android $TARGET_ARCH in release, enabling PGO use..."
            mkdir -p "$UPSTREAM/out/geckoview"
            gh release download "$ANDROID_RELEASE" --repo "$GITHUB_REPOSITORY" -p "android-$TARGET_ARCH-pgo.profdata" -D "$UPSTREAM/out/geckoview" || true
            if [[ -f "$UPSTREAM/out/geckoview/android-$TARGET_ARCH-pgo.profdata" ]]; then
              prof_sha=$(sha256sum "$UPSTREAM/out/geckoview/android-$TARGET_ARCH-pgo.profdata" | awk '{print $1}')
              cp "$UPSTREAM/out/geckoview/android-$TARGET_ARCH-pgo.profdata" "$UPSTREAM/out/geckoview/pgo-$prof_sha.profdata"
              export PGO_PROFILE_SHA256="$prof_sha"
              PGO_ARGS+=(--target pgo-use)
              echo "Activated PGO-use profile with SHA256: $prof_sha"
            fi
          fi

          ./rbm/rbm build browser --target alpha --target "mullvadbrowser-android-$TARGET_ARCH" "${PGO_ARGS[@]}"
      - name: Collect and stage APK artifacts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/android-apks"
          find "$UPSTREAM/out" -type f -name "*.apk" -exec cp -v {} "$RUNNER_TEMP/android-apks/" \; || true
          find "$UPSTREAM/out" -type f -name "*.bspatch" -exec cp -v {} "$RUNNER_TEMP/android-apks/" \; || true
      - name: Upload Mullvad Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: mullvad-browser-android-${{ inputs.arch || 'aarch64' }}-apk
          path: ${{ runner.temp }}/android-apks/
          retention-days: 14
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for apk in "$RUNNER_TEMP/android-apks"/*.apk; do
            if [[ -f "$apk" ]]; then
              echo "Uploading $apk to release $ANDROID_RELEASE..."
              gh release upload "$ANDROID_RELEASE" "$apk" --repo "$GITHUB_REPOSITORY" --clobber || true
            fi
          done
      - name: Upload build logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: ${{ runner.temp }}/tor-browser-build/logs/
          if-no-files-found: warn
