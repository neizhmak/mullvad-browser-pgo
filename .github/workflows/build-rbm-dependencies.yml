name: Build official RBM dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RBM_NO_DEBUG: "1"

concurrency:
  group: rbm-dependencies
  cancel-in-progress: false

jobs:
  clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps: &rbm_steps
      - name: Initialize shared build environment
        run: echo "UPSTREAM=$RUNNER_TEMP/tor-browser-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Name dependency release from upstream lock
        run: |
          tag="$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["tag"])')"
          echo "RBM_RELEASE=rbm-dependencies-$tag" >> "$GITHUB_ENV"
      - name: Install RBM host requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libdata-dump-perl libdata-uuid-perl libdatetime-perl \
            libdigest-sha-perl libfile-copy-recursive-perl libfile-slurp-perl \
            libio-all-perl libcapture-tiny-perl libio-handle-util-perl libjson-perl \
            libparallel-forkmanager-perl libpath-tiny-perl libsort-versions-perl \
            libstring-shellquote-perl libtemplate-perl libxml-libxml-perl \
            libxml-writer-perl libyaml-libyaml-perl git uidmap zstd jq zip
      - name: Prepare and validate RBM user namespaces
        shell: bash
        run: |
          set -euo pipefail

          build_user="$(id -un)"
          build_uid="$(id -u)"
          build_gid="$(id -g)"
          echo "RBM build user: $build_user (uid=$build_uid gid=$build_gid)"

          echo "Enabling unprivileged user namespaces required on Ubuntu 24.04+"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          missing_files=()
          for map_file in /etc/subuid /etc/subgid; do
            if ! awk -F: -v user="$build_user" '$1 == user && $3 > 0 { found = 1 } END { exit !found }' "$map_file"; then
              missing_files+=("$map_file")
            fi
          done

          if (( ${#missing_files[@]} )); then
            # Pick one 65536-ID range which does not overlap any range already
            # assigned in either mapping file, then use it only for missing maps.
            range_start="$(python3 - <<'PY'
          from pathlib import Path

          size = 65536
          ranges = []
          for filename in ('/etc/subuid', '/etc/subgid'):
              for line in Path(filename).read_text().splitlines():
                  fields = line.split(':')
                  if len(fields) != 3:
                      continue
                  try:
                      start, length = map(int, fields[1:])
                  except ValueError:
                      continue
                  if length > 0:
                      ranges.append((start, start + length))

          candidate = 100000
          while True:
              end = candidate + size
              conflicts = [stop for start, stop in ranges
                           if candidate < stop and start < end]
              if not conflicts:
                  print(candidate)
                  break
              candidate = max(conflicts)
          PY
            )"
            for map_file in "${missing_files[@]}"; do
              echo "Adding $build_user:$range_start:65536 to $map_file"
              printf '%s:%s:65536\n' "$build_user" "$range_start" | sudo tee -a "$map_file" >/dev/null
            done
          fi

          echo "User-namespace settings:"
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          sysctl kernel.apparmor_restrict_unprivileged_userns
          echo "Subordinate mappings for $build_user:"
          awk -F: -v user="$build_user" '$1 == user' /etc/subuid | sed 's/^/subuid: /'
          awk -F: -v user="$build_user" '$1 == user' /etc/subgid | sed 's/^/subgid: /'

          # Mirror rbm/container's mapping: the caller becomes namespace ID 0,
          # and the first subordinate ranges begin at namespace ID 1. RBM also
          # calls setgroups(0, NULL) after newgidmap, so exercise that operation.
          IFS=: read -r _ subuid_start subuid_count < <(
            awk -F: -v user="$build_user" '$1 == user && $3 > 0 { print; exit }' /etc/subuid
          )
          IFS=: read -r _ subgid_start subgid_count < <(
            awk -F: -v user="$build_user" '$1 == user && $3 > 0 { print; exit }' /etc/subgid
          )
          export build_uid build_gid subuid_start subuid_count subgid_start subgid_count

          namespace_command=(
            unshare --user
            --map-users="0:$build_uid:1"
            --map-users="1:$subuid_start:$subuid_count"
            --map-groups="0:$build_gid:1"
            --map-groups="1:$subgid_start:$subgid_count"
            --setgroups=allow
            sh -eu -c '
              echo "Inner identity: uid=$(id -u) gid=$(id -g)"
              echo "uid_map:"; cat /proc/self/uid_map
              echo "gid_map:"; cat /proc/self/gid_map
              echo "setgroups:"; cat /proc/self/setgroups
              awk -v outer="$build_uid" "\$1 == 0 && \$2 == outer && \$3 == 1 { found = 1 } END { exit !found }" /proc/self/uid_map
              awk -v start="$subuid_start" -v count="$subuid_count" "\$1 == 1 && \$2 == start && \$3 == count { found = 1 } END { exit !found }" /proc/self/uid_map
              awk -v outer="$build_gid" "\$1 == 0 && \$2 == outer && \$3 == 1 { found = 1 } END { exit !found }" /proc/self/gid_map
              awk -v start="$subgid_start" -v count="$subgid_count" "\$1 == 1 && \$2 == start && \$3 == count { found = 1 } END { exit !found }" /proc/self/gid_map
              setpriv --clear-groups true
            '
          )
          echo "Running RBM-compatible user-namespace preflight:"
          printf ' %q' "${namespace_command[@]}"; echo
          if "${namespace_command[@]}"; then
            echo "RBM user-namespace preflight succeeded."
          else
            status=$?
            echo "::error::RBM-compatible user-namespace preflight failed (status $status); see unshare/newuidmap/newgidmap diagnostics above." >&2
            exit "$status"
          fi
      - name: Fetch pinned official build tree
        run: |
          ./scripts/fetch-upstream.sh --destination "$UPSTREAM"
          git -C "$UPSTREAM" submodule update --init rbm
      - name: Restore verified RBM outputs
        run: ./scripts/rbm-release-artifacts.py restore --upstream "$UPSTREAM"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Record existing outputs
        run: ./scripts/rbm-release-artifacts.py snapshot --upstream "$UPSTREAM" --file "$RUNNER_TEMP/before"
      - name: Build stage through RBM
        timeout-minutes: 330
        run: |
          cd "$UPSTREAM"
          ./rbm/rbm showconf "$RBM_PROJECT" input_files --target alpha --target mullvadbrowser-windows-x86_64
          ./rbm/rbm build "$RBM_PROJECT" --target alpha --target mullvadbrowser-windows-x86_64
      - name: Publish new immutable RBM outputs
        run: ./scripts/rbm-release-artifacts.py publish --upstream "$UPSTREAM" --before "$RUNNER_TEMP/before" --stage "$RBM_PROJECT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload RBM build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbm-logs-${{ env.RBM_PROJECT }}
          path: ${{ runner.temp }}/tor-browser-build/logs/
          if-no-files-found: warn
    env:
      RBM_PROJECT: clang

  mingw-w64-clang:
    needs: clang
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps: *rbm_steps
    env:
      RBM_PROJECT: mingw-w64-clang

  rust:
    needs: mingw-w64-clang
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps: *rbm_steps
    env:
      RBM_PROJECT: rust
