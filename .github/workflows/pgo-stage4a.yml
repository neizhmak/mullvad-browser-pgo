name: Stage 4A - Generate verified Windows PGO profile
on:
  workflow_dispatch:
    inputs:
      toolchain_only:
        description: Build and verify the durable profiler Rust checkpoint only
        type: boolean
        default: false
      finish_pipeline:
        description: Build optimized Firefox, installer and portable, then validate on Windows
        type: boolean
        default: true
  workflow_call:
    inputs:
      finish_pipeline:
        type: boolean
        default: false
    outputs:
      profile_release:
        description: Immutable cross-language profile prerelease
        value: ${{ jobs.pgo-merge.outputs.release }}
      profile_identity:
        description: Verified full profile identity SHA-256
        value: ${{ jobs.pgo-merge.outputs.identity }}
permissions:
  contents: write
  actions: read
env:
  RBM_NO_DEBUG: "1"
concurrency:
  group: pgo-stage4a-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pgo-rust:
    uses: ./.github/workflows/pgo-toolchain.yml
    secrets: inherit
  pgo-support:
    if: ${{ !inputs.toolchain_only }}
    permissions:
      contents: write
    uses: ./.github/workflows/pgo-support.yml
    secrets: inherit
  pgo-generate:
    needs: [pgo-rust, pgo-support]
    if: ${{ !inputs.toolchain_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned build
        run: |
          echo "UPSTREAM=$RUNNER_TEMP/tor-browser-build" >> "$GITHUB_ENV"
          tag="$(jq -r .tag upstream.lock.json)"
          echo "RBM_RELEASE=rbm-dependencies-$tag" >> "$GITHUB_ENV"
      - name: Install RBM requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libdata-dump-perl libdata-uuid-perl libdatetime-perl libdigest-sha-perl libfile-copy-recursive-perl libfile-slurp-perl libio-all-perl libcapture-tiny-perl libio-handle-util-perl libjson-perl libparallel-forkmanager-perl libpath-tiny-perl libsort-versions-perl libstring-shellquote-perl libtemplate-perl libxml-libxml-perl libxml-writer-perl libyaml-libyaml-perl git uidmap zstd jq
      - name: Prepare and validate RBM user namespaces
        shell: bash
        run: |
          set -euo pipefail
          build_user="$(id -un)"
          echo "RBM build user: $build_user (uid=$(id -u) gid=$(id -g))"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          missing_files=()
          for map_file in /etc/subuid /etc/subgid; do
            if ! awk -F: -v user="$build_user" '$1 == user && $3 > 0 { found = 1 } END { exit !found }' "$map_file"; then
              missing_files+=("$map_file")
            fi
          done
          if (( ${#missing_files[@]} )); then
            range_start="$(python3 - <<'PYNS'
          from pathlib import Path
          size = 65536
          ranges = []
          for filename in ('/etc/subuid', '/etc/subgid'):
              for line in Path(filename).read_text().splitlines():
                  fields = line.split(':')
                  if len(fields) != 3:
                      continue
                  try:
                      start, length = map(int, fields[1:])
                  except ValueError:
                      continue
                  if length > 0:
                      ranges.append((start, start + length))
          candidate = 100000
          while True:
              end = candidate + size
              conflicts = [stop for start, stop in ranges if candidate < stop and start < end]
              if not conflicts:
                  print(candidate)
                  break
              candidate = max(conflicts)
          PYNS
            )"
            for map_file in "${missing_files[@]}"; do
              printf '%s:%s:65536\n' "$build_user" "$range_start" | sudo tee -a "$map_file" >/dev/null
            done
          fi
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          sysctl kernel.apparmor_restrict_unprivileged_userns
          awk -F: -v user="$build_user" '$1 == user' /etc/subuid | sed 's/^/subuid: /'
          awk -F: -v user="$build_user" '$1 == user' /etc/subgid | sed 's/^/subgid: /'
      - name: Fetch exact upstream and restore compilers
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ./scripts/fetch-upstream.sh --destination "$UPSTREAM"
          git -C "$UPSTREAM" submodule update --init rbm
          "$UPSTREAM/rbm/container" run -- /bin/true
          ./scripts/rbm-release-artifacts.py restore-required --upstream "$UPSTREAM" --stage clang --stage mingw-w64-clang --stage rust
      - name: Apply explicit cross-language generation overlay
        run: |
          ./scripts/prepare-pgo-generate.sh
          ./scripts/validate-pgo-overlay.sh
          ./scripts/resolve-pgo-rust-identity.py --upstream "$UPSTREAM" --output "$RUNNER_TEMP/pgo-rust-identity.json"
      - name: Restore exact native-verified profiler Rust
        env:
          GH_TOKEN: ${{ github.token }}
          PGO_TOOLCHAIN_RELEASE: ${{ needs.pgo-rust.outputs.release }}
        run: |
          set -euo pipefail
          expected="pgo-toolchains-$(jq -r .tag upstream.lock.json)-$(sha256sum "$RUNNER_TEMP/pgo-rust-identity.json" | cut -d' ' -f1)"
          test "$expected" = "$PGO_TOOLCHAIN_RELEASE"
          ./scripts/rbm-release-artifacts.py restore-required --upstream "$UPSTREAM" --release "$PGO_TOOLCHAIN_RELEASE" --stage rust-pgo --identity-file "$RUNNER_TEMP/pgo-rust-identity.json"
          ./scripts/preflight-pgo-rust.sh
      - name: Record exact Firefox source and compiler archive identities
        run: |
          ./scripts/resolve-pgo-provenance.sh
          ./scripts/capture-pgo-toolchains.py --upstream "$UPSTREAM" --provenance "$RUNNER_TEMP/provenance/build.json" --rust-identity "$RUNNER_TEMP/pgo-rust-identity.json" --tools "$RUNNER_TEMP/pgo-rust-preflight-tools"
      - name: Restore exact pinned Node support and bind archive bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PGO_SUPPORT_RELEASE: ${{ needs.pgo-support.outputs.release }}
          PGO_SUPPORT_IDENTITY: ${{ needs.pgo-support.outputs.identity_sha256 }}
        run: |
          ./scripts/restore-pgo-support.py --upstream "$UPSTREAM" --pgo-target pgo-generate --output-directory "$RUNNER_TEMP/pgo-support" --expected-release "$PGO_SUPPORT_RELEASE" --expected-identity "$PGO_SUPPORT_IDENTITY" --provenance "$RUNNER_TEMP/provenance/build.json"
      - name: Prepare verified Binutils input
        run: ./scripts/prepare-binutils-input.sh
      - name: Build only instrumented Firefox
        timeout-minutes: 285
        run: ./scripts/run-pgo-generate.sh
      - name: Bind exact instrumented browser package
        run: |
          set -euo pipefail
          package="$(find "$RUNNER_TEMP/instrumented" -maxdepth 1 -type f -name 'browser.tar.*' -print)"
          ./scripts/capture-pgo-toolchains.py --upstream "$UPSTREAM" --provenance "$RUNNER_TEMP/provenance/build.json" --rust-identity "$RUNNER_TEMP/pgo-rust-identity.json" --tools "$RUNNER_TEMP/pgo-rust-preflight-tools" --instrumented-package "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-instrumented-firefox
          path: ${{ runner.temp }}/instrumented/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-build-provenance
          path: ${{ runner.temp }}/provenance/
          if-no-files-found: error
      - name: Preserve generation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-generation-logs
          path: |
            ${{ runner.temp }}/pgo-generate-build.log
            ${{ runner.temp }}/pgo-generate-resources.jsonl
            ${{ runner.temp }}/pgo-support/
            ${{ runner.temp }}/tor-browser-build/logs/
            ${{ runner.temp }}/provenance/
          if-no-files-found: warn
  pgo-train:
    needs: pgo-generate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pin Mozilla build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pgo-instrumented-firefox
          path: ${{ runner.temp }}/instrumented
      - uses: actions/download-artifact@v4
        with:
          name: pgo-build-provenance
          path: ${{ runner.temp }}/provenance
      - name: Load exact Firefox identity
        shell: pwsh
        run: |
          $p = Get-Content "$env:RUNNER_TEMP\provenance\build.json" | ConvertFrom-Json
          "FIREFOX_REPOSITORY=$($p.firefox.repository)" >> $env:GITHUB_ENV
          "FIREFOX_REF=$($p.firefox.ref)" >> $env:GITHUB_ENV
          "FIREFOX_REVISION=$($p.firefox.revision)" >> $env:GITHUB_ENV
      - name: Run exact upstream profileserver natively
        shell: pwsh
        run: ./scripts/train-pgo.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-training-output
          path: ${{ runner.temp }}/training-output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve all training diagnostics and failed raw files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-training-logs
          path: ${{ runner.temp }}/training-output/
          if-no-files-found: warn
  pgo-merge:
    needs: pgo-train
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release: ${{ steps.profile.outputs.release }}
      identity: ${{ steps.profile.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pgo-training-output
          path: ${{ runner.temp }}/training
      - uses: actions/download-artifact@v4
        with:
          name: pgo-build-provenance
          path: ${{ runner.temp }}/provenance
      - name: Restore matching LLVM profile tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "UPSTREAM=$RUNNER_TEMP/tor-browser-build" >> "$GITHUB_ENV"
          release="rbm-dependencies-$(jq -r .tag upstream.lock.json)"
          ./scripts/rbm-release-artifacts.py restore-required --upstream "$RUNNER_TEMP/tor-browser-build" --release "$release" --stage mingw-w64-clang
          filename="$(jq -r .toolchains.clang.archive_filename "$RUNNER_TEMP/provenance/build.json")"
          archive="$RUNNER_TEMP/tor-browser-build/out/mingw-w64-clang/$filename"
          echo "$(jq -r .toolchains.clang.sha256 "$RUNNER_TEMP/provenance/build.json")  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/clang"
          tar -xaf "$archive" -C "$RUNNER_TEMP/clang"
          profdata="$RUNNER_TEMP/clang/mingw-w64-clang/bin/llvm-profdata"
          test -x "$profdata"
          echo "LLVM_PROFDATA=$profdata" >> "$GITHUB_ENV"
      - name: Merge and verify C++ AND Rust profile counters
        id: profile
        run: |
          ./scripts/merge-pgo-profile.py --llvm-profdata "$LLVM_PROFDATA" --training-directory "$RUNNER_TEMP/training" --build-provenance "$RUNNER_TEMP/provenance/build.json" --output-directory "$RUNNER_TEMP/profile"
          echo "release=$(./scripts/profile-artifacts.py release-tag --directory "$RUNNER_TEMP/profile")" >> "$GITHUB_OUTPUT"
          echo "identity=$(./scripts/profile-artifacts.py identity --directory "$RUNNER_TEMP/profile")" >> "$GITHUB_OUTPUT"
      - name: Create identity-bound technical profile prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_RELEASE: ${{ steps.profile.outputs.release }}
        run: |
          set -euo pipefail
          if gh release view "$PROFILE_RELEASE" >/dev/null 2>&1; then
            test "$(gh release view "$PROFILE_RELEASE" --json isPrerelease --jq .isPrerelease)" = true
          else
            gh release create "$PROFILE_RELEASE" --prerelease --latest=false --title "Verified Windows PGO inputs" --notes 'Technical C++/Rust profile checkpoint, not a browser product release. The Git tag anchors to the repository default branch; the profile registry binds the exact build and training inputs.'
          fi
      - name: Publish verified payloads with registry last
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_RELEASE: ${{ steps.profile.outputs.release }}
        run: ./scripts/publish-pgo-profile.py --repository "$GITHUB_REPOSITORY" --release "$PROFILE_RELEASE" --directory "$RUNNER_TEMP/profile"
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-verified-profile
          path: ${{ runner.temp }}/profile/
          if-no-files-found: error
      - name: Preserve merge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-merge-logs
          path: ${{ runner.temp }}/profile/
          if-no-files-found: warn
  pgo-finish:
    needs: pgo-merge
    if: ${{ inputs.finish_pipeline && !inputs.toolchain_only }}
    uses: ./.github/workflows/windows-pgo.yml
    with:
      profile_release: ${{ needs.pgo-merge.outputs.release }}
      profile_identity: ${{ needs.pgo-merge.outputs.identity }}
    secrets: inherit
