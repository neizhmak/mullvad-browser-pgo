            ${{ runner.temp }}/provenance/
            ${{ runner.temp }}/tor-browser-build/logs/
          if-no-files-found: warn
  pgo-windows-check:
    needs: pgo-package
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: mullvad-browser-alpha-windows-x86_64-pgo
          path: ${{ runner.temp }}/pgo-packages
      - name: Restore same-lock baseline with original artifact digest verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: python scripts/windows-runtime-check.py prepare-baseline --output-directory "$env:RUNNER_TEMP/baseline" --repository "$env:GITHUB_REPOSITORY"
      - name: Check installer and portable with an isolated offline native workload
        shell: pwsh
        run: ./scripts/check-windows-packages.ps1
      - name: Preserve native checks and raw benchmark samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-windows-runtime-report
          path: ${{ runner.temp }}/pgo-runtime-check/
          if-no-files-found: warn
