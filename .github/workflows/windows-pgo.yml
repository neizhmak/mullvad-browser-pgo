        run: ./scripts/prepare-binutils-input.sh
      - uses: actions/download-artifact@v4
        with:
          name: pgo-optimized-firefox
          path: ${{ runner.temp }}/optimized-firefox
      - name: Package verified Firefox without rebuilding it
        timeout-minutes: 240
        env:
          PGO_FIREFOX_ARTIFACT_DIR: ${{ runner.temp }}/optimized-firefox
        run: ./scripts/run-pgo-use.sh --stage browser
      - uses: actions/upload-artifact@v4
        with:
          name: mullvad-browser-alpha-windows-x86_64-pgo
          path: ${{ runner.temp }}/final-packages/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Preserve packaging diagnostics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-packaging-logs
          path: |
            ${{ runner.temp }}/pgo-use/*.log
            ${{ runner.temp }}/pgo-use/*.json
            ${{ runner.temp }}/pgo-use/*.rendered
            ${{ runner.temp }}/pgo-use/*.env
