name: Lightweight pipeline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native recipe test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libtemplate-perl libyaml-libyaml-perl openssl
          command -v pwsh
      - name: Run every lightweight suite and syntax check
        run: python3 scripts/run-tests.py
      - name: Validate workflow expressions
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -ignore '"steps" section is missing' \
            -ignore '"steps" section must be sequence node'
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse all PowerShell entry points natively
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Test native Windows process isolation and package contracts
        shell: pwsh
        run: python tests/test_windows_runtime.py -v
